<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="Ba mức mô tả dữ liệu"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#087f78"/></marker></defs><rect width="1100" height="640" rx="24" fill="#f5f9f8"/><text x="44" y="42" font-family="Arial, sans-serif" font-size="13" fill="#087f78" text-anchor="start" font-weight="700">DATABASE LEARNING LAB</text><text x="44" y="83" font-family="Arial, sans-serif" font-size="30" fill="#17333b" text-anchor="start" font-weight="700">Ba mức mô tả dữ liệu</text><text x="44" y="115" font-family="Arial, sans-serif" font-size="17" fill="#577077" text-anchor="start" font-weight="400">Không đồng nhất external / conceptual / internal với ba tầng frontend / API / server.</text><rect x="60" y="170" width="280" height="140" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="60" y="170" width="5" height="140" rx="2" fill="#087f78"/><text x="78" y="200" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">EXTERNAL</text><text x="78" y="229" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Góc nhìn giảng viên</text><text x="78" y="254" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Góc nhìn sinh viên</text><text x="78" y="279" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Một phần dữ liệu được phép xem</text><rect x="410" y="170" width="280" height="140" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="410" y="170" width="5" height="140" rx="2" fill="#087f78"/><text x="428" y="200" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">CONCEPTUAL</text><text x="428" y="229" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Entity, bảng, quan hệ</text><text x="428" y="254" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Khóa và ràng buộc</text><text x="428" y="279" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Toàn bộ cấu trúc logic</text><rect x="760" y="170" width="280" height="140" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="760" y="170" width="5" height="140" rx="2" fill="#087f78"/><text x="778" y="200" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">INTERNAL</text><text x="778" y="229" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">File / page / block</text><text x="778" y="254" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Index và access path</text><text x="778" y="279" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Cách tổ chức lưu trữ</text><path d="M345 238L400 238" fill="none" stroke="#087f78" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M695 238L750 238" fill="none" stroke="#087f78" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="65" y="375" width="460" height="130" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="65" y="375" width="5" height="130" rx="2" fill="#3b66bf"/><text x="83" y="405" font-family="Arial, sans-serif" font-size="19" fill="#3b66bf" text-anchor="start" font-weight="700">Logical data independence</text><text x="83" y="434" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Đổi cấu trúc logic; duy trì external interface.</text><text x="83" y="459" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Ví dụ: tách bảng và giữ view tương thích.</text><rect x="575" y="375" width="460" height="130" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="575" y="375" width="5" height="130" rx="2" fill="#087f78"/><text x="593" y="405" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">Physical data independence</text><text x="593" y="434" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Đổi storage/index; giữ interface logic.</text><text x="593" y="459" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Ví dụ: thêm index, SQL ứng dụng giữ nguyên.</text><text x="44" y="610" font-family="Arial, sans-serif" font-size="14" fill="#577077" text-anchor="start" font-weight="400">Mô hình minh họa · Đọc giả thiết trong bài học trước khi áp dụng.</text></svg>