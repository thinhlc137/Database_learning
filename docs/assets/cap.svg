<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="CAP: bắt đầu từ tình huống network partition"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#087f78"/></marker></defs><rect width="1100" height="640" rx="24" fill="#f5f9f8"/><text x="44" y="42" font-family="Arial, sans-serif" font-size="13" fill="#087f78" text-anchor="start" font-weight="700">DATABASE LEARNING LAB</text><text x="44" y="83" font-family="Arial, sans-serif" font-size="30" fill="#17333b" text-anchor="start" font-weight="700">CAP: bắt đầu từ tình huống network partition</text><text x="44" y="115" font-family="Arial, sans-serif" font-size="17" fill="#577077" text-anchor="start" font-weight="400">C theo CAP là linearizable consistency; A là availability theo định nghĩa hình thức.</text><rect x="60" y="175" width="350" height="140" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="60" y="175" width="5" height="140" rx="2" fill="#087f78"/><text x="78" y="205" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">Replica A</text><text x="78" y="234" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Nhận ghi: đặt ghế cuối</text><text x="78" y="259" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Không gửi được sang B</text><text x="78" y="284" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Giá trị cục bộ đã thay đổi</text><rect x="690" y="175" width="350" height="140" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="690" y="175" width="5" height="140" rx="2" fill="#087f78"/><text x="708" y="205" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">Replica B</text><text x="708" y="234" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Chưa thấy ghi mới ở A</text><text x="708" y="259" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Nhận một yêu cầu khác</text><text x="708" y="284" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Không xác minh được với A</text><path d="M425 240L675 240" fill="none" stroke="#b76b24" stroke-width="2.3" stroke-dasharray="7 5"/><text x="550" y="213" font-family="Arial, sans-serif" font-size="17" fill="#b76b24" text-anchor="middle" font-weight="700">MẤT LIÊN LẠC</text><rect x="60" y="400" width="460" height="125" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="60" y="400" width="5" height="125" rx="2" fill="#087f78"/><text x="78" y="430" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">Ưu tiên consistency</text><text x="78" y="459" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Có thể phải từ chối hoặc chờ request.</text><text x="78" y="484" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Không bảo đảm A cho mọi node không lỗi.</text><rect x="580" y="400" width="460" height="125" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="580" y="400" width="5" height="125" rx="2" fill="#3b66bf"/><text x="598" y="430" font-family="Arial, sans-serif" font-size="19" fill="#3b66bf" text-anchor="start" font-weight="700">Ưu tiên availability</text><text x="598" y="459" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Tiếp tục trả lời theo trạng thái cục bộ.</text><text x="598" y="484" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Có thể không giữ được C trong partition.</text><text x="44" y="610" font-family="Arial, sans-serif" font-size="14" fill="#577077" text-anchor="start" font-weight="400">Mô hình minh họa · Đọc giả thiết trong bài học trước khi áp dụng.</text></svg>