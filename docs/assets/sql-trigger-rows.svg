<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="SQL Server trigger: inserted và deleted là tập hàng"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#087f78"/></marker></defs><rect width="1100" height="640" rx="24" fill="#f5f9f8"/><text x="44" y="42" font-family="Arial, sans-serif" font-size="13" fill="#087f78" text-anchor="start" font-weight="700">DATABASE LEARNING LAB</text><text x="44" y="83" font-family="Arial, sans-serif" font-size="30" fill="#17333b" text-anchor="start" font-weight="700">SQL Server trigger: inserted và deleted là tập hàng</text><text x="44" y="115" font-family="Arial, sans-serif" font-size="17" fill="#577077" text-anchor="start" font-weight="400">Một UPDATE của phòng 5 tác động 4 nhân viên. Trigger xử lý cả bốn, không chọn một biến đại diện.</text><text x="60" y="172" font-family="Arial, sans-serif" font-size="22" fill="#087f78" text-anchor="start" font-weight="700">deleted: giá trị cũ</text><rect x="60" y="195" width="440" height="215" rx="10" fill="white" stroke="#c8dcd8"/><rect x="60" y="195" width="440" height="43" rx="8" fill="#e3f0ec"/><text x="74.0" y="223" font-family="Arial, sans-serif" font-size="17" fill="#087f78" text-anchor="start" font-weight="700">Ssn</text><text x="294.0" y="223" font-family="Arial, sans-serif" font-size="17" fill="#087f78" text-anchor="start" font-weight="700">Salary</text><text x="74.0" y="266" font-family="Arial, sans-serif" font-size="17" fill="#17333b" text-anchor="start" font-weight="400">123456789</text><text x="294.0" y="266" font-family="Arial, sans-serif" font-size="17" fill="#17333b" text-anchor="start" font-weight="400">30000</text><text x="74.0" y="309" font-family="Arial, sans-serif" font-size="17" fill="#17333b" text-anchor="start" font-weight="400">333445555</text><text x="294.0" y="309" font-family="Arial, sans-serif" font-size="17" fill="#17333b" text-anchor="start" font-weight="400">40000</text><text x="74.0" y="352" font-family="Arial, sans-serif" font-size="17" fill="#17333b" text-anchor="start" font-weight="400">453453453</text><text x="294.0" y="352" font-family="Arial, sans-serif" font-size="17" fill="#17333b" text-anchor="start" font-weight="400">25000</text><text x="74.0" y="395" font-family="Arial, sans-serif" font-size="17" fill="#17333b" text-anchor="start" font-weight="400">666884444</text><text x="294.0" y="395" font-family="Arial, sans-serif" font-size="17" fill="#17333b" text-anchor="start" font-weight="400">38000</text><text x="600" y="172" font-family="Arial, sans-serif" font-size="22" fill="#3b66bf" text-anchor="start" font-weight="700">inserted: giá trị mới</text><rect x="600" y="195" width="440" height="215" rx="10" fill="white" stroke="#c8dcd8"/><rect x="600" y="195" width="440" height="43" rx="8" fill="#e3f0ec"/><text x="614.0" y="223" font-family="Arial, sans-serif" font-size="17" fill="#087f78" text-anchor="start" font-weight="700">Ssn</text><text x="834.0" y="223" font-family="Arial, sans-serif" font-size="17" fill="#087f78" text-anchor="start" font-weight="700">Salary</text><text x="614.0" y="266" font-family="Arial, sans-serif" font-size="17" fill="#17333b" text-anchor="start" font-weight="400">123456789</text><text x="834.0" y="266" font-family="Arial, sans-serif" font-size="17" fill="#17333b" text-anchor="start" font-weight="400">31000</text><text x="614.0" y="309" font-family="Arial, sans-serif" font-size="17" fill="#17333b" text-anchor="start" font-weight="400">333445555</text><text x="834.0" y="309" font-family="Arial, sans-serif" font-size="17" fill="#17333b" text-anchor="start" font-weight="400">41000</text><text x="614.0" y="352" font-family="Arial, sans-serif" font-size="17" fill="#17333b" text-anchor="start" font-weight="400">453453453</text><text x="834.0" y="352" font-family="Arial, sans-serif" font-size="17" fill="#17333b" text-anchor="start" font-weight="400">26000</text><text x="614.0" y="395" font-family="Arial, sans-serif" font-size="17" fill="#17333b" text-anchor="start" font-weight="400">666884444</text><text x="834.0" y="395" font-family="Arial, sans-serif" font-size="17" fill="#17333b" text-anchor="start" font-weight="400">39000</text><path d="M510 300L590 300" fill="none" stroke="#087f78" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="60" y="455" width="980" height="100" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="60" y="455" width="5" height="100" rx="2" fill="#087f78"/><text x="78" y="485" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">Ghép old/new theo định danh ổn định để audit</text><text x="78" y="514" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">INSERT audit SELECT ... FROM inserted i JOIN deleted d ON d.Ssn=i.Ssn;</text><text x="44" y="610" font-family="Arial, sans-serif" font-size="14" fill="#577077" text-anchor="start" font-weight="400">Mô hình minh họa · Đọc giả thiết trong bài học trước khi áp dụng.</text></svg>