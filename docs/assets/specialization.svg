<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="Bốn tổ hợp specialization"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#087f78"/></marker></defs><rect width="1100" height="640" rx="24" fill="#f5f9f8"/><text x="44" y="42" font-family="Arial, sans-serif" font-size="13" fill="#087f78" text-anchor="start" font-weight="700">DATABASE LEARNING LAB</text><text x="44" y="83" font-family="Arial, sans-serif" font-size="30" fill="#17333b" text-anchor="start" font-weight="700">Bốn tổ hợp specialization</text><text x="44" y="115" font-family="Arial, sans-serif" font-size="17" fill="#577077" text-anchor="start" font-weight="400">d/o nói về giao; total/partial nói về độ bao phủ superclass.</text><rect x="60" y="160" width="470" height="175" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="60" y="160" width="5" height="175" rx="2" fill="#087f78"/><text x="78" y="190" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">Disjoint + total</text><text x="78" y="219" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">V ∩ A = ∅</text><text x="78" y="244" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">V ∪ A = ACCOUNT</text><text x="78" y="269" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Mỗi account đúng một loại.</text><rect x="570" y="160" width="470" height="175" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="570" y="160" width="5" height="175" rx="2" fill="#087f78"/><text x="588" y="190" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">Overlapping + total</text><text x="588" y="219" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Có thể thuộc cả V và A</text><text x="588" y="244" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">V ∪ A = ACCOUNT</text><text x="588" y="269" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Mỗi account có ít nhất một loại.</text><rect x="60" y="370" width="470" height="175" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="60" y="370" width="5" height="175" rx="2" fill="#087f78"/><text x="78" y="400" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">Disjoint + partial</text><text x="78" y="429" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">V ∩ A = ∅</text><text x="78" y="454" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Có thể thiếu account trong V ∪ A</text><text x="78" y="479" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Có thể chưa có loại.</text><rect x="570" y="370" width="470" height="175" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="570" y="370" width="5" height="175" rx="2" fill="#087f78"/><text x="588" y="400" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">Overlapping + partial</text><text x="588" y="429" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Có thể thuộc cả V và A</text><text x="588" y="454" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Có thể thiếu account trong V ∪ A</text><text x="588" y="479" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Có thể kiêm nhiệm hoặc chưa có loại.</text><text x="44" y="610" font-family="Arial, sans-serif" font-size="14" fill="#577077" text-anchor="start" font-weight="400">Mô hình minh họa · Đọc giả thiết trong bài học trước khi áp dụng.</text></svg>