<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="Đọc SQL theo thứ tự logic"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#087f78"/></marker></defs><rect width="1100" height="640" rx="24" fill="#f5f9f8"/><text x="44" y="42" font-family="Arial, sans-serif" font-size="13" fill="#087f78" text-anchor="start" font-weight="700">DATABASE LEARNING LAB</text><text x="44" y="83" font-family="Arial, sans-serif" font-size="30" fill="#17333b" text-anchor="start" font-weight="700">Đọc SQL theo thứ tự logic</text><text x="44" y="115" font-family="Arial, sans-serif" font-size="17" fill="#577077" text-anchor="start" font-weight="400">Optimizer có thể chọn thứ tự vật lý khác nhưng phải giữ ngữ nghĩa truy vấn.</text><rect x="50" y="170" width="220" height="100" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="50" y="170" width="5" height="100" rx="2" fill="#087f78"/><text x="68" y="200" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">FROM / ON</text><text x="68" y="229" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Tạo các cặp match</text><path d="M274 220L303 220" fill="none" stroke="#087f78" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="315" y="170" width="220" height="100" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="315" y="170" width="5" height="100" rx="2" fill="#087f78"/><text x="333" y="200" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">WHERE</text><text x="333" y="229" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Giữ hàng TRUE</text><path d="M539 220L568 220" fill="none" stroke="#087f78" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="580" y="170" width="220" height="100" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="580" y="170" width="5" height="100" rx="2" fill="#087f78"/><text x="598" y="200" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">GROUP / HAVING</text><text x="598" y="229" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Tạo và lọc nhóm</text><path d="M804 220L833 220" fill="none" stroke="#087f78" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="845" y="170" width="220" height="100" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="845" y="170" width="5" height="100" rx="2" fill="#087f78"/><text x="863" y="200" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">SELECT / ORDER</text><text x="863" y="229" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Tính output, sắp xếp</text><rect x="50" y="350" width="480" height="175" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="50" y="350" width="5" height="175" rx="2" fill="#087f78"/><text x="68" y="380" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">LEFT JOIN + ON Salary&gt;40000</text><text x="68" y="409" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">ON chọn cặp; vẫn giữ phòng không match.</text><text x="68" y="434" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Administration → Jennifer</text><text x="68" y="459" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Headquarters → James</text><text x="68" y="484" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Innovation, Research → NULL</text><rect x="570" y="350" width="480" height="175" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="570" y="350" width="5" height="175" rx="2" fill="#b76b24"/><text x="588" y="380" font-family="Arial, sans-serif" font-size="19" fill="#b76b24" text-anchor="start" font-weight="700">LEFT JOIN rồi WHERE Salary&gt;40000</text><text x="588" y="409" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">WHERE loại hàng khi predicate UNKNOWN.</text><text x="588" y="434" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Administration → Jennifer</text><text x="588" y="459" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Headquarters → James</text><text x="588" y="484" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Innovation, Research bị loại.</text><text x="44" y="610" font-family="Arial, sans-serif" font-size="14" fill="#577077" text-anchor="start" font-weight="400">Mô hình minh họa · Đọc giả thiết trong bài học trước khi áp dụng.</text></svg>