<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="JOIN: mỗi cặp hàng khớp trở thành một hàng"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#087f78"/></marker></defs><rect width="1100" height="640" rx="24" fill="#f5f9f8"/><text x="44" y="42" font-family="Arial, sans-serif" font-size="13" fill="#087f78" text-anchor="start" font-weight="700">DATABASE LEARNING LAB</text><text x="44" y="83" font-family="Arial, sans-serif" font-size="30" fill="#17333b" text-anchor="start" font-weight="700">JOIN: mỗi cặp hàng khớp trở thành một hàng</text><text x="44" y="115" font-family="Arial, sans-serif" font-size="17" fill="#577077" text-anchor="start" font-weight="400">A có khóa 1,2. B có khóa 2,3. Điều kiện ON A.id=B.id.</text><rect x="60" y="170" width="350" height="129" rx="10" fill="white" stroke="#c8dcd8"/><rect x="60" y="170" width="350" height="43" rx="8" fill="#e3f0ec"/><text x="74.0" y="198" font-family="Arial, sans-serif" font-size="17" fill="#087f78" text-anchor="start" font-weight="700">A.id</text><text x="249.0" y="198" font-family="Arial, sans-serif" font-size="17" fill="#087f78" text-anchor="start" font-weight="700">A.label</text><text x="74.0" y="241" font-family="Arial, sans-serif" font-size="17" fill="#17333b" text-anchor="start" font-weight="400">1</text><text x="249.0" y="241" font-family="Arial, sans-serif" font-size="17" fill="#17333b" text-anchor="start" font-weight="400">A</text><text x="74.0" y="284" font-family="Arial, sans-serif" font-size="17" fill="#17333b" text-anchor="start" font-weight="400">2</text><text x="249.0" y="284" font-family="Arial, sans-serif" font-size="17" fill="#17333b" text-anchor="start" font-weight="400">B</text><rect x="690" y="170" width="350" height="129" rx="10" fill="white" stroke="#c8dcd8"/><rect x="690" y="170" width="350" height="43" rx="8" fill="#e3f0ec"/><text x="704.0" y="198" font-family="Arial, sans-serif" font-size="17" fill="#087f78" text-anchor="start" font-weight="700">B.id</text><text x="879.0" y="198" font-family="Arial, sans-serif" font-size="17" fill="#087f78" text-anchor="start" font-weight="700">B.label</text><text x="704.0" y="241" font-family="Arial, sans-serif" font-size="17" fill="#17333b" text-anchor="start" font-weight="400">2</text><text x="879.0" y="241" font-family="Arial, sans-serif" font-size="17" fill="#17333b" text-anchor="start" font-weight="400">X</text><text x="704.0" y="284" font-family="Arial, sans-serif" font-size="17" fill="#17333b" text-anchor="start" font-weight="400">3</text><text x="879.0" y="284" font-family="Arial, sans-serif" font-size="17" fill="#17333b" text-anchor="start" font-weight="400">Y</text><path d="M415 275L680 230" fill="none" stroke="#087f78" stroke-width="2.3" marker-end="url(#arrow)"/><text x="550" y="198" font-family="Arial, sans-serif" font-size="18" fill="#087f78" text-anchor="middle" font-weight="700">Chỉ cặp id=2 khớp</text><rect x="60" y="380" width="310" height="160" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="60" y="380" width="5" height="160" rx="2" fill="#087f78"/><text x="78" y="410" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">INNER JOIN</text><text x="78" y="439" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">2, B, 2, X</text><text x="78" y="464" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Chỉ hàng có cặp khớp</text><rect x="395" y="380" width="310" height="160" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="395" y="380" width="5" height="160" rx="2" fill="#3b66bf"/><text x="413" y="410" font-family="Arial, sans-serif" font-size="19" fill="#3b66bf" text-anchor="start" font-weight="700">LEFT JOIN</text><text x="413" y="439" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">1, A, NULL, NULL</text><text x="413" y="464" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">2, B, 2, X</text><text x="413" y="489" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Giữ mọi hàng bên A</text><rect x="730" y="380" width="310" height="160" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="730" y="380" width="5" height="160" rx="2" fill="#b76b24"/><text x="748" y="410" font-family="Arial, sans-serif" font-size="19" fill="#b76b24" text-anchor="start" font-weight="700">FULL JOIN</text><text x="748" y="439" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">1, A, NULL, NULL</text><text x="748" y="464" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">2, B, 2, X</text><text x="748" y="489" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">NULL, NULL, 3, Y</text><text x="44" y="610" font-family="Arial, sans-serif" font-size="14" fill="#577077" text-anchor="start" font-weight="400">Mô hình minh họa · Đọc giả thiết trong bài học trước khi áp dụng.</text></svg>