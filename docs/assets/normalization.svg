<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="Bao đóng A⁺: chỉ dừng khi không thêm được gì"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#087f78"/></marker></defs><rect width="1100" height="640" rx="24" fill="#f5f9f8"/><text x="44" y="42" font-family="Arial, sans-serif" font-size="13" fill="#087f78" text-anchor="start" font-weight="700">DATABASE LEARNING LAB</text><text x="44" y="83" font-family="Arial, sans-serif" font-size="30" fill="#17333b" text-anchor="start" font-weight="700">Bao đóng A⁺: chỉ dừng khi không thêm được gì</text><text x="44" y="115" font-family="Arial, sans-serif" font-size="17" fill="#577077" text-anchor="start" font-weight="400">R(A,B,C,D,E), F = {A→BC, B→D, CD→E}.</text><rect x="60" y="165" width="470" height="115" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="60" y="165" width="5" height="115" rx="2" fill="#087f78"/><text x="78" y="195" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">0 · Khởi tạo</text><text x="78" y="224" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">A⁺ = {A}</text><rect x="570" y="165" width="470" height="115" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="570" y="165" width="5" height="115" rx="2" fill="#087f78"/><text x="588" y="195" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">1 · Áp dụng A→BC</text><text x="588" y="224" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">A⁺ = {A,B,C}</text><rect x="60" y="330" width="470" height="115" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="60" y="330" width="5" height="115" rx="2" fill="#087f78"/><text x="78" y="360" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">2 · Áp dụng B→D</text><text x="78" y="389" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">A⁺ = {A,B,C,D}</text><rect x="570" y="330" width="470" height="115" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="570" y="330" width="5" height="115" rx="2" fill="#087f78"/><text x="588" y="360" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">3 · Áp dụng CD→E</text><text x="588" y="389" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">A⁺ = {A,B,C,D,E}</text><path d="M535 222L555 222" fill="none" stroke="#087f78" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M805 292V312H295V320" fill="none" stroke="#087f78" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M535 387L555 387" fill="none" stroke="#087f78" stroke-width="2.3" marker-end="url(#arrow)"/><text x="60" y="515" font-family="Arial, sans-serif" font-size="20" fill="#17333b" text-anchor="start" font-weight="700">A xác định toàn bộ R → superkey. A không suy được từ các thuộc tính khác.</text><text x="60" y="550" font-family="Arial, sans-serif" font-size="18" fill="#577077" text-anchor="start" font-weight="400">Ở ví dụ này: A là candidate key duy nhất; không suy điều đó cho mọi bộ FD.</text><text x="44" y="610" font-family="Arial, sans-serif" font-size="14" fill="#577077" text-anchor="start" font-weight="400">Mô hình minh họa · Đọc giả thiết trong bài học trước khi áp dụng.</text></svg>