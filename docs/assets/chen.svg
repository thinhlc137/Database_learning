<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="Chen: maximum khác minimum"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#087f78"/></marker></defs><rect width="1100" height="640" rx="24" fill="#f5f9f8"/><text x="44" y="42" font-family="Arial, sans-serif" font-size="13" fill="#087f78" text-anchor="start" font-weight="700">DATABASE LEARNING LAB</text><text x="44" y="83" font-family="Arial, sans-serif" font-size="30" fill="#17333b" text-anchor="start" font-weight="700">Chen: maximum khác minimum</text><text x="44" y="115" font-family="Arial, sans-serif" font-size="17" fill="#577077" text-anchor="start" font-weight="400">ANIME—GENRE là M:N; ANIME total, GENRE partial theo miniworld của lab.</text><ellipse cx="160" cy="190" rx="95" ry="32" fill="white" stroke="#087f78" stroke-width="2"/><text x="160" y="196" font-family="Arial, sans-serif" font-size="19" fill="#17333b" text-anchor="middle" font-weight="400">AnimeID</text><path d="M120 201L200 201" fill="none" stroke="#087f78" stroke-width="2.3"/><path d="M160 222L160 280" fill="none" stroke="#087f78" stroke-width="2.3"/><rect x="60" y="280" width="220" height="90" fill="white" stroke="#087f78" stroke-width="2.5"/><text x="170" y="334" font-family="Arial, sans-serif" font-size="23" fill="#17333b" text-anchor="middle" font-weight="700">ANIME</text><rect x="820" y="280" width="220" height="90" fill="white" stroke="#087f78" stroke-width="2.5"/><text x="930" y="334" font-family="Arial, sans-serif" font-size="23" fill="#17333b" text-anchor="middle" font-weight="700">GENRE</text><polygon points="550,255 680,325 550,395 420,325" fill="#e3f0ec" stroke="#087f78" stroke-width="2.5"/><text x="550" y="332" font-family="Arial, sans-serif" font-size="21" fill="#17333b" text-anchor="middle" font-weight="400">Has_genre</text><path d="M280 321L420 321" fill="none" stroke="#087f78" stroke-width="2.3"/><path d="M280 329L420 329" fill="none" stroke="#087f78" stroke-width="2.3"/><path d="M680 325L820 325" fill="none" stroke="#087f78" stroke-width="2.3"/><text x="345" y="304" font-family="Arial, sans-serif" font-size="21" fill="#17333b" text-anchor="start" font-weight="700">M</text><text x="750" y="304" font-family="Arial, sans-serif" font-size="21" fill="#17333b" text-anchor="start" font-weight="700">N</text><rect x="60" y="440" width="460" height="110" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="60" y="440" width="5" height="110" rx="2" fill="#087f78"/><text x="78" y="470" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">ANIME: ít nhất một</text><text x="78" y="499" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Đường đôi = total participation.</text><text x="78" y="524" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Không giới hạn tối đa là một.</text><rect x="580" y="440" width="460" height="110" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="580" y="440" width="5" height="110" rx="2" fill="#3b66bf"/><text x="598" y="470" font-family="Arial, sans-serif" font-size="19" fill="#3b66bf" text-anchor="start" font-weight="700">GENRE: có thể chưa được dùng</text><text x="598" y="499" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Đường đơn = partial participation.</text><text x="598" y="524" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Có thể gắn với nhiều anime.</text><text x="44" y="610" font-family="Arial, sans-serif" font-size="14" fill="#577077" text-anchor="start" font-weight="400">Mô hình minh họa · Đọc giả thiết trong bài học trước khi áp dụng.</text></svg>