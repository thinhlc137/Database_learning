<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="B+ tree: separator ở trong, data entries ở lá"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#087f78"/></marker></defs><rect width="1100" height="640" rx="24" fill="#f5f9f8"/><text x="44" y="42" font-family="Arial, sans-serif" font-size="13" fill="#087f78" text-anchor="start" font-weight="700">DATABASE LEARNING LAB</text><text x="44" y="83" font-family="Arial, sans-serif" font-size="30" fill="#17333b" text-anchor="start" font-weight="700">B+ tree: separator ở trong, data entries ở lá</text><text x="44" y="115" font-family="Arial, sans-serif" font-size="17" fill="#577077" text-anchor="start" font-weight="400">Cây minh họa key tăng dần; internal separator là khóa nhỏ nhất ở nhánh bên phải.</text><rect x="425" y="160" width="250" height="85" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="425" y="160" width="5" height="85" rx="2" fill="#087f78"/><text x="443" y="190" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">[ 20 | 40 ]</text><text x="443" y="219" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Internal node</text><rect x="65" y="355" width="250" height="105" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="65" y="355" width="5" height="105" rx="2" fill="#087f78"/><text x="83" y="385" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">[ 5 | 10 ]</text><text x="83" y="414" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">Data entries &lt; 20</text><rect x="425" y="355" width="250" height="105" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="425" y="355" width="5" height="105" rx="2" fill="#087f78"/><text x="443" y="385" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">[ 20 | 30 ]</text><text x="443" y="414" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">20 ≤ keys &lt; 40</text><rect x="785" y="355" width="250" height="105" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="785" y="355" width="5" height="105" rx="2" fill="#087f78"/><text x="803" y="385" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">[ 40 | 50 ]</text><text x="803" y="414" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">keys ≥ 40</text><path d="M460 250L190 345" fill="none" stroke="#087f78" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M550 250L550 345" fill="none" stroke="#087f78" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M640 250L910 345" fill="none" stroke="#087f78" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M320 410L415 410" fill="none" stroke="#087f78" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M680 410L775 410" fill="none" stroke="#087f78" stroke-width="2.3" marker-end="url(#arrow)"/><text x="60" y="530" font-family="Arial, sans-serif" font-size="20" fill="#17333b" text-anchor="start" font-weight="700">Point lookup: root → đúng leaf. Range scan: tìm leaf đầu → duyệt liên kết lá.</text><text x="60" y="565" font-family="Arial, sans-serif" font-size="18" fill="#577077" text-anchor="start" font-weight="400">Sức chứa internal và leaf khác nhau; ghi rõ pointer, header và quy ước order.</text><text x="44" y="610" font-family="Arial, sans-serif" font-size="14" fill="#577077" text-anchor="start" font-weight="400">Mô hình minh họa · Đọc giả thiết trong bài học trước khi áp dụng.</text></svg>