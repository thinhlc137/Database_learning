<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="Bảng liên kết giữ đúng ngữ nghĩa M:N"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#087f78"/></marker></defs><rect width="1100" height="640" rx="24" fill="#f5f9f8"/><text x="44" y="42" font-family="Arial, sans-serif" font-size="13" fill="#087f78" text-anchor="start" font-weight="700">DATABASE LEARNING LAB</text><text x="44" y="83" font-family="Arial, sans-serif" font-size="30" fill="#17333b" text-anchor="start" font-weight="700">Bảng liên kết giữ đúng ngữ nghĩa M:N</text><text x="44" y="115" font-family="Arial, sans-serif" font-size="17" fill="#577077" text-anchor="start" font-weight="400">Bản rút gọn của 12 bảng trong sql/anime-schema.sql · PK = khóa chính, FK = khóa ngoại.</text><rect x="50" y="160" width="280" height="130" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="50" y="160" width="5" height="130" rx="2" fill="#087f78"/><text x="68" y="190" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">WATCH_LIST</text><text x="68" y="219" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">PK list_id</text><text x="68" y="244" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">FK viewer_id → VIEWER</text><text x="68" y="269" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">name</text><rect x="410" y="160" width="280" height="130" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="410" y="160" width="5" height="130" rx="2" fill="#087f78"/><text x="428" y="190" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">CONTAINS</text><text x="428" y="219" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">PK/FK list_id</text><text x="428" y="244" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">PK/FK anime_id</text><text x="428" y="269" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">added_at ← thuộc quan hệ</text><rect x="770" y="160" width="280" height="130" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="770" y="160" width="5" height="130" rx="2" fill="#087f78"/><text x="788" y="190" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">ANIME</text><text x="788" y="219" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">PK anime_id</text><text x="788" y="244" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">title</text><text x="788" y="269" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">release_year</text><path d="M410 218L340 218" fill="none" stroke="#087f78" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M690 218L760 218" fill="none" stroke="#087f78" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="50" y="380" width="280" height="125" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="50" y="380" width="5" height="125" rx="2" fill="#087f78"/><text x="68" y="410" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">EPISODE</text><text x="68" y="439" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">PK/FK anime_id</text><text x="68" y="464" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">PK episode_no</text><text x="68" y="489" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">title, duration_sec</text><rect x="410" y="380" width="280" height="125" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="410" y="380" width="5" height="125" rx="2" fill="#087f78"/><text x="428" y="410" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">ANIME_GENRE</text><text x="428" y="439" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">PK/FK anime_id</text><text x="428" y="464" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">PK/FK genre_id</text><rect x="770" y="380" width="280" height="125" rx="12" fill="white" stroke="#c8dcd8" stroke-width="2"/><rect x="770" y="380" width="5" height="125" rx="2" fill="#087f78"/><text x="788" y="410" font-family="Arial, sans-serif" font-size="19" fill="#087f78" text-anchor="start" font-weight="700">GENRE</text><text x="788" y="439" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">PK genre_id</text><text x="788" y="464" font-family="Arial, sans-serif" font-size="16" fill="#17333b" text-anchor="start" font-weight="400">name UNIQUE</text><path d="M550 380V332H910V300" fill="none" stroke="#087f78" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M690 440L760 440" fill="none" stroke="#087f78" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M190 380V345H730V260H760" fill="none" stroke="#087f78" stroke-width="2.3" marker-end="url(#arrow)"/><text x="50" y="558" font-family="Arial, sans-serif" font-size="18" fill="#b76b24" text-anchor="start" font-weight="400">FK không tự buộc ANIME phải xuất hiện trong ANIME_GENRE ít nhất một lần.</text><text x="44" y="610" font-family="Arial, sans-serif" font-size="14" fill="#577077" text-anchor="start" font-weight="400">Mô hình minh họa · Đọc giả thiết trong bài học trước khi áp dụng.</text></svg>