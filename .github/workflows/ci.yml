name: Database learning checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python tools/diagrams.py
      - run: python tools/build.py
      - run: python tools/check.py
      - run: node --check docs/app.js
      - run: git diff --exit-code -- docs/content.js docs/coverage.json docs/assets/
